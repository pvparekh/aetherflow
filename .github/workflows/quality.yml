name: Candidate verification
on:
  push:
    branches: [main, feat/product-upgrade, feat/leak-finder]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Deterministic, offline eval checks (golden set, normaliser, demo data,
      # planted leaks). Never calls a model; `npm run eval` is manual only.
      - name: Eval checks
        run: npm run eval:ci
      - run: npm run verify
